
name: GTA Turkce Dublaj APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Find Android project
        run: |
          SETTINGS=$(find . -name settings.gradle -not -path '*/.gradle/*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle bulunamadi"
            find . -maxdepth 4 -type f
            exit 1
          fi
          echo "PROJECT_ROOT=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p "$PROJECT_ROOT" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA-Turkce-Dublaj-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
