
name: GTA Turkce Dublaj APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        run: |
          if [ -f settings.gradle ]; then
            ROOT=.
          elif [ -f GtaTurkceDublaj/settings.gradle ]; then
            ROOT=GtaTurkceDublaj
          else
            echo "settings.gradle bulunamadi"
            exit 1
          fi
          gradle -p "$ROOT" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA-Turkce-Dublaj-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            GtaTurkceDublaj/app/build/outputs/apk/debug/*.apk
